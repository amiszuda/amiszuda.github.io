<!DOCTYPE html>
<html lang="en">

<title>Amadeusz Miszuda, PhD</title>

<!-- Latin Modern font from Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Latin+Modern+Roman&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Latin Modern Roman', serif;
        background-image: url('img/bg-kopia.jpg');  
        background-size: cover;                 
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: fixed;           
        color: #ddd;
        line-height: 1.7;
        font-size: 18px;
    }

    h1 {
        font-size: 56px;
        font-weight: 500;
        margin: 0;
        line-height: 1.2;
    }

    h2, h3 {
        font-family: 'Latin Modern Roman', serif;
        font-weight: 400;
        line-height: 1.3;
        margin: 12px 0 20px 0;
    }

    .small-line {
        font-size: 30px; 
        font-weight: 400;
    }

    .smaller-line {
        font-size: 22px; 
        font-weight: 300;
    }
    

    /*---------------------------------
            background pattern
    ---------------------------------*/

    .bg {
        /*background-image: url('bg-kopia.jpg');*/
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        padding: 60px 20px 120px 20px;
        text-align: center;
    }

    .photo {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        object-fit: cover;
        margin: 10px 0 30px 0;
        box-shadow: 0px 0px 20px rgba(0,0,0,0.15);
    }

    .buttons {
        margin-bottom: 60px;
    }

    .btn {
        display: inline-block;
        padding: 12px 40px;
        margin: 8px;
        border: 2px solid #888;
        border-radius: 10px;
        font-size: 18px;
        font-family: 'Latin Modern Roman', serif;
        text-decoration: none;
        color: #ddd;
        transition: 0.2s;
    }

    .btn:hover {
        /*background: #f4f4f4;*/
    }


    /*---------------------------------
            central content
    ---------------------------------*/
    .wrapper {
        max-width: 780px;
        margin: -100px auto 50px auto;
        padding: 10px 10px;
        font-family: 'Latin Modern Roman', serif;

        position: relative;
        z-index: 1;

        /* transparent + soft blur gradient */
        background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 80%);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);

        box-shadow: 0 0 20px rgba(0,0,0,0.02); /* bardzo subtelne */
    }

    /*.wrapper p {
        margin-bottom: 1.2em;
    }*/

    a {
        color: #b40000;
        text-decoration: none;
        font-weight: 600;
    }

    a:hover {
        text-decoration: underline;
    }

    .icon-link:hover svg {
        opacity: 0.6;
    }

    #content {
        text-align: justify;
    }

    #content a {
        color: #ddd;
        font-weight: normal;  /* bez pogrubienia */
        text-decoration: underline;
    }

    #content a:hover {
        text-decoration: underline;
    }

    /*---------------------------------
                   footer
    ---------------------------------*/
    /*footer {
        text-align: center;
        padding: 30px;
        font-size: 16px;
        color: #777;
        font-family: 'Latin Modern Roman', serif;
    }*/
    footer {
        display: flex;
        justify-content: space-between;
        align-items: center;       /* Wyrównanie pionowe */
        padding: 20px 40px;        /* odsunięcie od brzegów (ważne!) */
        font-size: 16px;
        color: #777;
        font-family: 'Latin Modern Roman', serif;

        height: 60px;              /* <<< wymusza jedną linię */
        box-sizing: border-box;
    }

    /* LEWA STRONA */
    .footer-left {
        display: flex;
        align-items: center;
        gap: 24px;                 /* większy odstęp między ikonami */
    }

    /* odstęp od lewej krawędzi */
    .footer-left {
        margin-left: 10px;
    }

    /* PRAWA STRONA */
    .footer-right {
        white-space: nowrap;
        margin-right: 10px;
    }

    /* IKONY */
    .icon-link svg {
        width: 22px;
        height: 22px;
        fill: #777;
        display: block;            /* <<< eliminuje wpływ na line-height */
        transition: opacity 0.2s;
    }

</style>

<!-- Markdown parser -->
<script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>

<script>
async function loadMD() {
    const res = await fetch('content.md');
    const txt = await res.text();
    const converter = new showdown.Converter({tables:true, ghCodeBlocks:true});
    document.getElementById("content").innerHTML = converter.makeHtml(txt);
}

loadMD();
</script>

</head>

<div class="bg">
    <h1>Amadeusz Miszuda, PhD</h1>
    <h3>
        <span class="small-line"><b>Stellar Astrophysicist</b> and <b>Asteroseismologist</b></span> at <br>
        <span class="smaller-line">Nicolaus Copernicus Astronomical Centre</span> <br>
        <span class="smaller-line">Polish Academy of Sciences</span>
    </h3>

    <img src="img/photo.jpg" class="photo" alt="profile photo">

    <div class="buttons">
        <a href="files/CV_resume.pdf" class="btn">CV</a>
        <a href="https://shorturl.at/baZMk" class="btn">ADS</a>
        <a href="https://orcid.org/0000-0002-9382-2542" class="btn">ORCID</a>
    </div>
</div>

<div class="wrapper">
    <div id="content">
        <!-- MD will load here -->
    </div>
</div>
